<html lang="en">

<meta name="description" content="Discover your love language. A 5 Love Languages quiz for individuals and couples with a personalised love report, partner compatibility and 28-day challenges.">
<meta property="og:title" content="Love Style Quiz">
<meta property="og:description" content="How do you feel most loved? Take the 5 Love Languages quiz alone or as a couple.">
<meta property="og:type" content="website">

<title>Love Style Quiz</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Base reset (the artifact host adds this automatically; standalone hosting needs it here) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a single letter-paper column; the quiz is one card at a time, the report is a long read with a sticky chapter bar. */
:root{
  --paper:#f7f4f7; --sheet:#fffdfe; --ink:#251a2b; --ink-2:#5d5064; --line:#e6dde7; --wash:#efe8f0;
  --accent:#a3245a; --accent-ink:#fff; --accent-wash:#f7e3ec;
  --W:#4b4fc4; --Q:#11807a; --G:#c27a07; --A:#4d8a2c; --T:#c4366b;
  --display:"Gloock", "Iowan Old Style", Georgia, serif;
  --body:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17121a; --sheet:#211a25; --ink:#f3ecf4; --ink-2:#b8aabd; --line:#3a2f3f; --wash:#2a2130;
  --accent:#f0739f; --accent-ink:#1b1016; --accent-wash:#3b2030;
  --W:#9a9df5; --Q:#4fc9c0; --G:#f0b54a; --A:#8fcf6a; --T:#f37fa6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17121a; --sheet:#211a25; --ink:#f3ecf4; --ink-2:#b8aabd; --line:#3a2f3f; --wash:#2a2130;
  --accent:#f0739f; --accent-ink:#1b1016; --accent-wash:#3b2030;
  --W:#9a9df5; --Q:#4fc9c0; --G:#f0b54a; --A:#8fcf6a; --T:#f37fa6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(2.3rem,7vw,3.6rem)}
h2{font-size:clamp(1.6rem,4.4vw,2.2rem)}
h3{font-size:1.3rem}
p{margin:0}
.muted{color:var(--ink-2)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,.btn{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:12px 22px;font-weight:600}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{border-color:transparent;padding-inline:8px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=text],textarea{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
textarea{min-height:84px;font-size:.85rem;word-break:break-all}

/* Home */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px}
.brand{font-family:var(--display);font-size:1.25rem}
.hero{padding-block:28px 8px;display:grid;gap:20px}
.hero p.lede{font-size:1.15rem;max-width:56ch;color:var(--ink-2)}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-block:8px}
.five div{border-radius:12px;padding:12px 10px;background:var(--sheet);border:1px solid var(--line);font-size:.82rem;line-height:1.25;min-width:0}
.five b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem;margin-bottom:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}
.start{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{text-align:left;border-radius:var(--r);border:1.5px solid var(--line);background:var(--sheet);padding:20px;display:grid;gap:6px;font-weight:400}
.choice b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.choice:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--sheet)}
.seg button{border:0;padding:8px 14px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.included{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-block:28px;border-top:1px solid var(--line);margin-top:24px}
.included ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.included li{padding-left:26px;position:relative}
.included li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}

/* Quiz */
.quiz{padding-block:20px;display:grid;gap:22px}
.progress{height:6px;background:var(--wash);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stem{font-family:var(--display);font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;color:var(--accent)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border-radius:var(--r);border:1.5px solid var(--line);background:var(--sheet);padding:20px;font-weight:500;font-size:1.05rem;line-height:1.35;transition:border-color .12s,transform .12s}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--accent);background:var(--accent-wash)}
.key{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.or{text-align:center;font-family:var(--display);color:var(--ink-2);font-size:.95rem;margin-block:-4px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.form{display:grid;gap:22px}
.field{display:grid;gap:8px}
.field>span{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{padding:10px 18px;font-weight:500;border-color:var(--line);background:var(--sheet)}
.pills button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-wash);color:var(--ink)}

/* Report */
.rhead{padding-block:24px 12px;display:grid;gap:14px}
.who{display:inline-flex;gap:6px;flex-wrap:wrap}
.chapters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chapters a{flex:none;font-size:.85rem;font-weight:600;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet)}
.chapters a:hover{color:var(--ink);border-color:var(--ink-2)}
section.chap{padding-block:40px 8px;display:grid;gap:18px;scroll-margin-top:60px}
.primary{border-radius:20px;padding:28px;color:#fff;display:grid;gap:10px}
.primary h2{font-size:clamp(2rem,6vw,2.8rem)}
.primary p{max-width:60ch;opacity:.95}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center;font-size:.95rem}
.bar .track{height:14px;border-radius:8px;background:var(--wash);overflow:hidden}
.bar .fill{height:100%;border-radius:8px}
.bar .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>*{min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--wash)}
.rep{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--line)}
.rep h3 .n{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--accent);margin-right:10px;vertical-align:middle;font-variant-numeric:tabular-nums}
.rep ul{margin:0;padding-left:20px;display:grid;gap:6px}
.lang-tag{font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.day{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:.92rem;line-height:1.4}
.day input{margin-top:3px;accent-color:var(--accent);flex:none;width:18px;height:18px}
.day .d{font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:2px}
.day.done{opacity:.6}
.day.done .txt{text-decoration:line-through}
.week{display:grid;gap:10px}
.week h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.week h3 small{font-family:var(--body);font-size:.85rem;color:var(--ink-2)}
.score{font-family:var(--display);font-size:3.6rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.note{background:var(--wash);border-radius:12px;padding:16px 18px;font-size:.95rem}
.road{display:grid;gap:0;counter-reset:s}
.stage{display:grid;grid-template-columns:44px 1fr;gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.stage .num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.areas .card{padding:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:.85rem;color:var(--ink-2)}
@media (max-width:620px){
  .five{grid-template-columns:repeat(2,1fr)} .five div:last-child{grid-column:span 2}
  .start,.included,.cols{grid-template-columns:1fr}
  .bar{grid-template-columns:96px 1fr 42px;font-size:.85rem}
  .primary{padding:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function questionSet(len){
  const all = Q.map((_,i)=>i);
  if(len!=="quick") return all;
  const cross = all.filter(i=>Q[i][1][0]!==Q[i][3][0]);
  const n = 40, step = cross.length/n, out=[];
  for(let k=0;k<n;k++) out.push(cross[Math.floor(k*step)]);
  return out;
}
function newPerson(){ return {name:"", gender:"", rel:S.mode==="couple"?"yes":"", qs:questionSet(S.length), ans:[], give:[]}; }

/* ---------- Scoring ---------- */
function score(p){
  const hit={}, off={}, dHit={}, dOff={};
  LK.forEach(k=>{hit[k]=0; off[k]=0;});
  p.qs.forEach((qi,i)=>{
    const a=p.ans[i]; if(a==null) return;
    const q=Q[qi], ca=q[1], cb=q[3], pick=a===0?ca:cb;
    dOff[ca]=(dOff[ca]||0)+1; if(cb!==ca) dOff[cb]=(dOff[cb]||0)+1;
    dHit[pick]=(dHit[pick]||0)+1;
    if(ca[0]!==cb[0]){ off[ca[0]]++; off[cb[0]]++; hit[pick[0]]++; }
  });
  const rate={}; LK.forEach(k=>rate[k]= off[k]? hit[k]/off[k] : 0);
  const recv = norm(rate);
  const gc={}; LK.forEach(k=>gc[k]=0.5);
  p.give.forEach((a,i)=>{ if(a!=null) gc[GQ[i][a===0?1:3]]++; });
  LK.forEach(k=>gc[k]+=recv[k]*0.01); // tie-break toward receiving style
  const give = norm(gc);
  const dia = Object.keys(dOff).map(c=>({code:c, lang:c[0], rate:dHit[c]? (dHit[c]/dOff[c]) : 0, n:dOff[c]})).sort((a,b)=>b.rate-a.rate||b.n-a.n);
  return mkResult(p.name, p.gender, p.rel, recv, give, dia.slice(0,6).map(d=>d.code));
}
function norm(o){ const s=LK.reduce((t,k)=>t+o[k],0)||1; const r={}; LK.forEach(k=>r[k]=o[k]/s); return r; }
function mkResult(name,gender,rel,recv,give,topDia){
  const order=[...LK].sort((a,b)=>recv[b]-recv[a]);
  const gorder=[...LK].sort((a,b)=>give[b]-give[a]);
  return {name:name||"You", gender, rel, recv, give, order, gorder, topDia};
}
function pct(x){ return Math.round(x*100); }
function pctRow(o){ // percentages that add to 100
  const raw=LK.map(k=>o[k]*100), fl=raw.map(Math.floor); let rem=100-fl.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(rem>0){fl[i]++;rem--;} });
  const r={}; LK.forEach((k,i)=>r[k]=fl[i]); return r;
}

/* Partner codes: the result travels as a short text code (no server). */
function encode(r){
  const o={n:r.name,g:r.gender,r:LK.map(k=>Math.round(r.recv[k]*1000)),v:LK.map(k=>Math.round(r.give[k]*1000)),d:r.topDia};
  return "LOVE-"+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,"");
}
function decode(code){
  try{
    const b=code.trim().replace(/^LOVE-/i,"").replace(/\s+/g,"");
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    const rv={}, gv={}; LK.forEach((k,i)=>{rv[k]=o.r[i]/1000; gv[k]=o.v[i]/1000;});
    return mkResult(String(o.n||"Partner").slice(0,40), o.g, "yes", norm(rv), norm(gv), Array.isArray(o.d)?o.d.filter(c=>typeof c==="string"&&LANG[c[0]]):[]);
  }catch(e){ return null; }
}

/* Compatibility */
function compat(a,b){
  const overlap=LK.reduce((t,k)=>t+Math.min(a.recv[k],b.recv[k]),0);
  const ab=LK.reduce((t,k)=>t+Math.min(a.give[k],b.recv[k]),0);
  const ba=LK.reduce((t,k)=>t+Math.min(b.give[k],a.recv[k]),0);
  const total=Math.round(100*(0.4*overlap+0.3*ab+0.3*ba));
  return {overlap,ab,ba,total};
}

      ${[["yes","Yes"],["no","No"]].map(([v,t])=>`<button data-act="rel" data-v="${v}" aria-pressed="${p.rel===v}">${t}</button>`).join("")}</div></div>`}
    <div><button class="btn btn-primary" data-act="begin" ${ok?"":"disabled"}>Start the quiz</button></div>
  </div>
  <p class="muted" style="font-size:.9rem">Pick the option that feels more loving to you, even when both appeal. Go with your first instinct. There are no wrong answers.</p></div>`;
}

function quiz(){
  const p=S.people[S.cur], recvN=p.qs.length, N=recvN+GQ.length, i=S.qi;
  const inGive=i>=recvN, idx=inGive?i-recvN:i;
  const stem = inGive ? "When I want to show love, I usually…" : (p.rel==="no" ? "I feel most loved when someone close to me…" : "I feel most loved when my partner…");
  const opts = inGive ? [GQ[idx][0],GQ[idx][2]] : [Q[p.qs[idx]][0],Q[p.qs[idx]][2]];
  const cur = inGive ? p.give[idx] : p.ans[idx];
  return `${topbar()}<div class="quiz">
    <div class="progress" aria-hidden="true"><i style="width:${(i/N)*100}%"></i></div>
    <div class="qmeta"><span>${S.mode==="couple"?esc(p.name)+" · ":""}${inGive?"Part 2 · How you give love":"Part 1 · How you receive love"}</span><span>${i+1} / ${N}</span></div>
    ${inGive&&idx===0?`<p class="note">Last part. These ${GQ.length} questions are about how <b>you</b> express love to others.</p>`:""}
    <div class="stem">${stem}</div>
    <div class="opts">
      <button class="opt ${cur===0?"sel":""}" data-act="ans" data-v="0"><span class="key">1</span><span>${esc(opts[0])}</span></button>
      <div class="or">or</div>
      <button class="opt ${cur===1?"sel":""}" data-act="ans" data-v="1"><span class="key">2</span><span>${esc(opts[1])}</span></button>
    </div>
    <div class="row" style="justify-content:space-between"><button class="btn-ghost" data-act="back" ${i===0?"disabled":""}>← Previous</button><span class="muted" style="font-size:.85rem">Keys 1 and 2 work too</span></div>
  </div>`;
}

function handoff(){
  const a=S.people[0];
  return `${topbar()}<div class="quiz" style="padding-top:48px"><span class="eyebrow">Halfway there</span>
  <h2>Thanks, ${esc(a.name)}. Now hand the device to your partner.</h2>
  <p class="muted">Your results stay hidden until you both finish, so your partner's answers stay their own.</p>
  <div><button class="btn btn-primary" data-act="partner2">I'm the partner. Let's go</button></div></div>`;
}

/* ---------- Report ---------- */
function results(){
  const rs=S.people.filter(p=>p.done).map(score);
  if(S.partner && rs.length===1) rs.push(S.partner);
  return rs;
}
function report(){
  const rs=results(); if(!rs.length) return home();
  const v=Math.min(S.view, rs.length-1), me=rs[v], other=rs.length>1?rs[1-v]:null;
  const ownIdx = S.partner && rs.length===2 ? [0] : rs.map((_,i)=>i); // imported partner gets results + compatibility only
  const isOwn = ownIdx.includes(v);
  const rel = me.rel!=="no" || !!other;
  const pp = other ? other.name : (rel ? "your partner" : "someone you love");
  const pr = pctRow(me.recv), first=me.order[0], second=me.order[1], least=me.order[4];
  const chaps=[["results","Results"],["report","Love Report"],["growth","28-Day Growth"],["partner","Partner"],["together","28-Day Relationship"],["roadmap","Roadmap"],["science","The science"]];
  return `${topbar()}
  <div class="rhead">
    ${rs.length>1?`<div class="who" role="group" aria-label="Whose report">${rs.map((r,i)=>`<div class="pills"><button data-act="view" data-v="${i}" aria-pressed="${i===v}">${esc(r.name)}${S.partner&&i===1?" (partner code)":""}</button></div>`).join("")}</div>`:""}
    ${S.sample?`<p class="note"><b>This is a sample report</b> for an example couple, Linh and Minh. Switch between them above. <button class="btn-ghost" data-act="restart">Take the quiz yourself</button></p>`:""}
    <span class="eyebrow">${esc(me.name)}'s love style</span>
  </div>
  <nav class="chapters" aria-label="Report chapters">${chaps.map(([id,t])=>`<a href="#${id}" data-act="jump" data-v="${id}">${t}</a>`).join("")}</nav>

  <section class="chap" id="results">
    <div class="primary" style="background:${col(first)}">
      <span class="eyebrow" style="color:inherit;opacity:.85">Primary love style · ${pr[first]}%</span>
      <h2>${L(first).name}</h2><p><i>${L(first).tagline}</i> ${L(first).desc}</p>
    </div>
    <div class="row"><span class="chip"><span class="dot" style="background:${col(second)}"></span>Secondary: ${L(second).name}</span>
      <span class="chip"><span class="dot" style="background:${col(least)}"></span>Least comfortable: ${L(least).name}</span>
      <span class="chip"><span class="dot" style="background:${col(me.gorder[0])}"></span>Gives love mostly through: ${L(me.gorder[0]).name}</span></div>
    <div class="cols">
      <div class="card stack"><h3>How you receive love</h3>${bars(me.recv)}</div>
      <div class="card stack"><h3>How you give love</h3>${bars(me.give)}</div>
    </div>
    ${me.topDia.length?`<div class="card stack"><h3>Your love dialects</h3><p class="muted">Within each language, these specific expressions moved you most.</p>
      <div class="row">${me.topDia.map(c=>`<span class="chip"><span class="dot" style="background:${col(c[0])}"></span>${dname(c)} <span class="muted">· ${L(c[0]).short}</span></span>`).join("")}</div></div>`:""}
    ${isOwn ? shareBox(me):""}
  </section>

  <section class="chap" id="report"><span class="eyebrow">Your love report</span><h2>What your results mean</h2>
    ${loveReport(me, other, pp)}
  </section>

  <section class="chap" id="growth"><span class="eyebrow">28-day personal-growth challenge</span><h2>Love yourself in your own language</h2>
    <p class="muted">One small task a day. Week 1 fills your cup with your primary style, week 2 your secondary, week 3 stretches your least comfortable style, and week 4 rounds out the rest. Tick days off as you go; they're saved on this device.</p>
    ${challenge("g"+me.name, growthWeeks(me), SELF_TASKS, null)}
  </section>

  <section class="chap" id="partner"><span class="eyebrow">Partner compatibility</span>
    ${other? compatView(me,other) : invite(me)}
  </section>

  <section class="chap" id="together"><span class="eyebrow">28-day relationship challenge</span><h2>${other?`Speak ${esc(other.name)}'s language`:rel?"Speak your partner's language":"Strengthen the bonds that matter"}</h2>
    <p class="muted">${other?`Each week targets one of ${esc(other.name)}'s love styles, from most to least important to them. Ask ${esc(other.name)} to open their view and do the same for you.`
      : `Without your partner's results yet, this plan stretches the styles you give least, since those are the ones people most often miss. Compare codes in the Partner chapter to tailor it.`}</p>
    ${challenge("r"+me.name+(other?other.name:""), relWeeks(me,other), REL_TASKS, pp)}
  </section>

  <section class="chap" id="roadmap"><span class="eyebrow">Roadmap</span><h2>Strengthen all your relationships</h2>${roadmap(me, other, pp)}</section>

  <section class="chap" id="science"><span class="eyebrow">About the model</span><h2>The 5 Love Languages, and what research says</h2>${science()}</section>
  ${foot()}`;
}

function shareBox(me){
  const code=encode(me);
  return `<div class="card stack"><h3>Compare with your partner</h3>
  <p class="muted">Send this code to your partner. They choose “I have a code from my partner” on the home screen, take the quiz, and you both get a compatibility breakdown. You can also paste their code in the Partner chapter.</p>
  <textarea id="mycode" readonly aria-label="Your code">${code}</textarea>
  <div><button class="btn" data-act="copy">Copy my code</button></div></div>`;
}

function loveReport(me, other, pp){
  const [a,b]=me.order, least=me.order[4], low2=me.order[3], g0=me.gorder[0];
  const sameGR = me.gorder[0]===me.order[0];
  const items=[
   ["Your primary and secondary love styles", `<p>Your primary style is ${tag(a)} and your secondary is ${tag(b)}. Most people respond to all five; these two are where love lands fastest for you.</p>
     <div class="cols"><div><b>What fills your tank</b><ul>${L(a).feels.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><b>What drains it</b><ul>${L(a).blockers.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
     <p>From your secondary style: ${L(b).feels.slice(0,2).join("; ").toLowerCase()}.</p>`],
   ["Your love giving vs receiving styles", `<p>You most naturally <b>give</b> love through ${tag(g0)} and most want to <b>receive</b> it through ${tag(a)}. ${L(g0).giving}</p>
     <p>${sameGR? "Your giving and receiving styles match, so you tend to give love the way you'd like to get it. That's lovely when the other person shares your style. Otherwise, check that they're receiving it the way you intend." : `Because these differ, you may pour effort into ${L(g0).short.toLowerCase()} while quietly hoping for ${L(a).short.toLowerCase()}. Say so. People can't speak a language they don't know you need.`}</p>`],
   ["Partner compatibility", other? `<p>See the Partner chapter for your full breakdown with ${esc(other.name)}.</p>` : `<p>Compatibility isn't about having the same style. It's about each of you learning the other's. Share your code (in Results) to unlock your compatibility breakdown.</p>`],
   ["How love styles can strengthen your relationship", `<p>Chapman's central idea is the “love tank”: when your partner regularly speaks your primary language, your tank stays full, and conflict, stress and differences feel easier to weather. When it runs empty, even well-meant gestures can go unnoticed.</p><p>Naming your styles out loud gives both of you a shared vocabulary: “I'm running low on ${L(a).short.toLowerCase()}” is easier to say, and to hear, than a vague sense of not feeling loved.</p>`],
   ["Tips to speak each other's love language", `<p><b>For ${esc(pp)}, to love you well:</b></p><ul>${L(a).toLove.map(x=>`<li>${x}</li>`).join("")}</ul>
     ${other?`<p><b>For you, to love ${esc(other.name)} well</b> (their primary is ${tag(other.order[0])}):</p><ul>${L(other.order[0]).toLove.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}`],
   ["Getting comfortable with your least comfortable love styles", `<p>Your lowest-scoring styles are ${tag(low2)} and ${tag(least)}. Someone you love may need exactly these, and the language that feels least natural to you is often the one you'll need to learn.</p><p><b>${L(least).name}:</b> ${L(least).stretch}</p><p><b>${L(low2).name}:</b> ${L(low2).stretch}</p>`],
   ["Your style with friends and family", `<p>${L(a).social}</p>`],
   ["Love style and self-love", `<p>${L(a).self}</p>`],
   ["Your love style in the workplace", `<p>${L(a).work} Your secondary style adds this: ${L(b).work.split(". ")[0].toLowerCase()}.</p>`],
   ["Love style and your personality", `<p>${L(a).personality}</p>${me.topDia[0]?`<p>Your strongest dialect is <b>${dname(me.topDia[0])}</b>. That says more about you than the broad language does: it is the specific way you most like love expressed.</p>`:""}<p class="muted">Love languages describe preferences, not personality types. Read this as a reflection, not a diagnosis.</p>`],
   ["How your love style affects your finances", `<p>${L(a).money}</p><p>${L(b).money.split(". ")[0]}.</p>`],
   ["Love styles and parenting", `<p>${L(a).parenting}</p><p>Children's love languages often show from around age 5–6. Watch what they ask for and how they show affection to you.</p>`]
  ];
  return items.map(([h,body],i)=>`<div class="rep"><h3><span class="n">${String(i+1).padStart(2,"0")}</span>${h}</h3>${body}</div>`).join("");
}

function growthWeeks(me){
  const o=me.order;
  return [[o[0],"Fill your cup"],[o[1],"Deepen your secondary"],[o[4],"Stretch your least comfortable"],[[o[2],o[3]],"Round out the rest"]];
}
function relWeeks(me,other){
  if(other){ const o=other.order; return [[o[0],`${other.name}'s primary`],[o[1],`${other.name}'s secondary`],[o[2],`Their third style`],[[o[3],o[4]],"Cover every base"]]; }
  const g=[...me.gorder].reverse(); // least-given first
  return [[g[0],"The style you give least"],[g[1],"Your next gap"],[g[2],"Building range"],[[g[3],g[4]],"Your natural strengths"]];
}
function challenge(key, weeks, pool, who){
  let day=0;
  return weeks.map(([lang,title],w)=>{
    const langs=Array.isArray(lang)?lang:[lang];
    const days=[...Array(7)].map((_,i)=>{
      const k=langs[i%langs.length], t=pool[k][Array.isArray(lang)?Math.floor(i/2)+ (i%2?3:0) : i] || pool[k][i%7];
      day++; const id=key+"|"+day, done=!!S.checks[id];
      const text=who? t.replaceAll("{p}", who) : t;
      return `<label class="day ${done?"done":""}"><input type="checkbox" data-act="check" data-v="${esc(id)}" ${done?"checked":""}><span><span class="d">Day ${day} · <span style="color:${col(k)}">${L(k).short}</span></span><span class="txt">${esc(text)}</span></span></label>`;
    }).join("");
    return `<div class="week"><h3>Week ${w+1}: ${esc(title)} <small>${langs.map(k=>L(k).name).join(" + ")}</small></h3><div class="days">${days}</div></div>`;
  }).join("");
}

function invite(me){
  return `<h2>See how your styles fit together</h2>
  <p class="muted">Your partner takes the quiz on their own device and sends you their code, or you send yours. Paste their code here.</p>
  <div class="card stack"><label class="field"><span>Partner's code</span><textarea id="pcode2" placeholder="LOVE-…"></textarea></label>
  <div><button class="btn btn-primary" data-act="addpartner">Compare</button></div></div>
  <p class="muted">Sitting together? Choose “Start over”, then “Us, together”, to take turns on this device.</p>`;
}

function compatView(a,b){
  const c=compat(a,b);
  const label = c.total>=80?"Naturally in sync":c.total>=65?"Complementary":"Different languages, big potential";
  const shared=LK.filter(k=>a.order.slice(0,2).includes(k)&&b.order.slice(0,2).includes(k));
  const gaps=(x,y)=>LK.filter(k=>y.recv[k]>=0.22 && x.give[k]<=0.16).sort((p,q)=>y.recv[q]-y.recv[p]);
  const gab=gaps(a,b), gba=gaps(b,a);
  const pa=pctRow(a.recv), pb=pctRow(b.recv);
  return `<h2>${esc(a.name)} &amp; ${esc(b.name)}</h2>
  <div class="cols">
    <div class="card stack"><span class="eyebrow">Love style match</span><div class="score">${c.total}%</div><b>${label}</b>
      <p class="muted" style="font-size:.9rem">Blends how alike your receiving styles are (${pct(c.overlap)}%) with how well each of you naturally gives what the other needs (${esc(a.name)}→${esc(b.name)} ${pct(c.ab)}%, ${esc(b.name)}→${esc(a.name)} ${pct(c.ba)}%).</p></div>
    <div class="card stack"><h3>Side by side</h3>
      ${[...LK].sort((x,y)=>(b.recv[y]+a.recv[y])-(b.recv[x]+a.recv[x])).map(k=>`<div class="bar" style="grid-template-columns:96px 1fr 70px"><span>${L(k).short}</span>
        <div style="display:grid;gap:3px"><div class="track" style="height:8px"><div class="fill" style="width:${Math.max(pa[k],2)}%;background:${col(k)}"></div></div><div class="track" style="height:8px"><div class="fill" style="width:${Math.max(pb[k],2)}%;background:${col(k)};opacity:.5"></div></div></div>
        <span class="pct" style="font-size:.8rem">${pa[k]} · ${pb[k]}</span></div>`).join("")}
      <p class="muted" style="font-size:.85rem">Solid bar: ${esc(a.name)} · faded bar: ${esc(b.name)} (receiving %)</p></div>
  </div>
  <div class="rep"><h3>Where you connect</h3>${shared.length?`<p>You share ${shared.map(tag).join(" and ")} among your top styles. Gestures here land for both of you, so lean on them during stressful seasons.</p>`:`<p>Your top styles differ: ${esc(a.name)} leads with ${tag(a.order[0])}, ${esc(b.name)} with ${tag(b.order[0])}. That's very common, and the fix is learnable. Each of you practises the other's language on purpose.</p>`}</div>
  <div class="rep"><h3>How ${esc(a.name)} can love ${esc(b.name)} best</h3><ul>${L(b.order[0]).toLove.slice(0,3).concat(L(b.order[1]).toLove.slice(0,2)).map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="rep"><h3>How ${esc(b.name)} can love ${esc(a.name)} best</h3><ul>${L(a.order[0]).toLove.slice(0,3).concat(L(a.order[1]).toLove.slice(0,2)).map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="rep"><h3>Potential love blockers</h3>${(gab.length||gba.length)?`<ul>
    ${gab.map(k=>`<li>${esc(b.name)} values ${tag(k)}, but it isn't how ${esc(a.name)} naturally gives love. Watch for: ${L(k).blockers[0].toLowerCase()}.</li>`).join("")}
    ${gba.map(k=>`<li>${esc(a.name)} values ${tag(k)}, but it isn't how ${esc(b.name)} naturally gives love. Watch for: ${L(k).blockers[0].toLowerCase()}.</li>`).join("")}</ul>`
    :`<p>No major gaps: each of you already gives a fair amount of what the other values. Keep it up, and check in as life changes.</p>`}</div>
  <div class="rep"><h3>Your dialects</h3><p>${esc(a.name)}: ${a.topDia.slice(0,3).map(dname).join(", ")||"–"}.<br>${esc(b.name)}: ${b.topDia.slice(0,3).map(dname).join(", ")||"–"}.</p><p class="muted">Two people with the same language can still prefer different dialects. One Quality Time lover wants deep talks, another wants adventures. Ask each other for examples.</p></div>`;
}

function roadmap(me, other, pp){
  const a=me.order[0], least=me.order[4];
  const stages=[
    ["Understand","Week 1",`Read your report together with ${esc(pp)}. Each of you names one recent moment you felt very loved, and one moment you felt overlooked. Match those moments to your styles.`],
    ["Practise","Weeks 1–4",`Run both 28-day challenges. Keep it light: one task a day, ticked off here.`],
    ["Stretch","Month 2",`Focus on ${L(least).name}, your least comfortable style, with family, friends and at work, where the stakes feel lower.`],
    ["Sustain","Month 3 and beyond",`Hold a monthly 15-minute “love tank check”: each of you rates your tank from 0 to 10 and names one thing that would raise it. Retake the quiz every 6–12 months; styles shift with seasons of life.`]
  ];
  const areas=[
    ["Partner", other?`Lead with ${L(other.order[0]).name} for ${esc(other.name)}, and ask for ${L(a).name} for yourself.`:`Share your code and ask your partner to take the quiz. Tell them one specific ${L(a).short.toLowerCase()} gesture that would mean a lot.`],
    ["Family", `Ask one family member how they feel most appreciated, and try it this month.`],
    ["Friends", `Your friends get your natural ${L(me.gorder[0]).name}. Add one gesture from a different style to a friend who needs it.`],
    ["Work", `Tell your manager or team how you like recognition (${L(a).short.toLowerCase()}), and ask how they like theirs.`],
    ["Self", `Keep up one week-1 habit from your growth challenge long after day 28.`]
  ];
  return `<div class="road">${stages.map(([t,w,d],i)=>`<div class="stage"><span class="num">${i+1}</span><div><h3>${t} <small class="muted" style="font-family:var(--body);font-size:.85rem">· ${w}</small></h3><p>${d}</p></div></div>`).join("")}</div>
  <h3 style="margin-top:12px">Across your relationships</h3><div class="areas">${areas.map(([t,d])=>`<div class="card"><b>${t}</b><p class="muted" style="margin-top:6px">${d}</p></div>`).join("")}</div>`;
}

function science(){
  return `<div class="stack">
  <p>Marriage counsellor Gary Chapman introduced the five love languages in <i>The 5 Love Languages</i> (1992), based on patterns he saw in couples counselling: <b>Words of Affirmation, Quality Time, Receiving Gifts, Acts of Service</b> and <b>Physical Touch</b>. He also described “dialects”, specific forms within each language, which this quiz scores separately.</p>
  <p>This quiz uses forced choices. Each question pits two loving gestures against each other, so your results show <i>relative</i> preferences. Your percentages are calculated only from questions that compare two different languages, so no language is favoured just because it appears more often.</p>
  <div class="note"><b>What research says.</b> Studies broadly confirm that people have preferences for how they receive love. Evidence that couples are happier when they <i>share</i> a love language is weak. More consistently, people are more satisfied when their partner shows love in the ways they value, and when partners show love in many ways. Some researchers suggest treating the five like a balanced diet: everyone needs some of each, and needs shift over time.</div>
  <p class="muted">This quiz is for self-reflection and conversation, not a clinical assessment. Loving gestures never make up for disrespect or harm. If you feel unsafe in a relationship, please reach out to a local support service.</p></div>`;
}

function foot(){ return `<footer>Based on Gary Chapman's five love languages. Your answers stay on this device. Nothing is sent anywhere.</footer>`; }

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  if(act==="check") return; // handled on change
  if(act==="jump"){ e.preventDefault(); document.getElementById(v)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return; }
  if(act==="len"){ S.length=v; save(); render(); return; }
  if(act==="go"){ go(v); return; }
  if(act==="restart"){ const checks=S.checks, len=S.length; S=fresh(); S.checks=checks; S.length=len; go("home"); return; }
  if(act==="start"){ S.mode=v; S.people=[]; S.partner=null; S.cur=0; S.qi=0; S.view=0; S.people.push(newPerson()); go("setup"); return; }
  if(act==="usecode"){ const c=document.getElementById("pcode").value; const r=decode(c); if(!r){ toast("That code doesn't look right. Copy the whole code."); return; }
    S.mode="solo"; S.people=[newPerson()]; S.partner=r; S.cur=0; S.qi=0; S.view=0; S.people[0].rel="yes"; go("setup"); return; }
  if(act==="gender"||act==="rel"){ const p=S.people[S.cur]; p.name=document.getElementById("nm").value; p[act]=v; save(); render(); return; }
  if(act==="begin"){ const p=S.people[S.cur]; p.name=document.getElementById("nm").value.trim(); if(!p.name) return; S.qi=0; go("quiz"); return; }
  if(act==="sample"){ loadSample(); go("report"); return; }
  if(act==="ans"){ answer(+v); return; }
  if(act==="back"){ if(S.qi>0){ S.qi--; save(); render(); } return; }
  if(act==="partner2"){ S.cur=1; if(!S.people[1]) S.people.push(newPerson()); go("setup"); return; }
  if(act==="view"){ S.view=+v; save(); render(); return; }
  if(act==="copy"){ const t=document.getElementById("mycode"); const done=()=>toast("Code copied");
    if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(done).catch(()=>{t.select(); toast("Press Ctrl/⌘+C to copy");}); else { t.select(); toast("Press Ctrl/⌘+C to copy"); } return; }
  if(act==="addpartner"){ const r=decode(document.getElementById("pcode2").value); if(!r){ toast("That code doesn't look right. Copy the whole code."); return; } S.partner=r; save(); render(); document.getElementById("partner")?.scrollIntoView(); return; }
});
document.addEventListener("change", e=>{
  const el=e.target; if(el.dataset.act!=="check") return;
  S.checks[el.dataset.v]=el.checked; save(); el.closest(".day").classList.toggle("done", el.checked);
});
document.addEventListener("input", e=>{
  if(e.target.id==="nm"){ const p=S.people[S.cur]; p.name=e.target.value; save();
    const b=document.querySelector('[data-act="begin"]'); if(b) b.disabled=!(p.name.trim()&&p.gender&&p.rel); }
  if(e.target.id==="pcode"){ S.pendingCode=e.target.value; }
});
document.addEventListener("keydown", e=>{
  if(S.screen!=="quiz"||e.target.matches("input,textarea")) return;
  if(e.key==="1") answer(0);
  else if(e.key==="2") answer(1);
  else if(e.key==="Backspace"&&S.qi>0){ S.qi--; save(); render(); }
});

/* Sample couple: Linh leans Touch then Time; Minh leans Words then Service. */
function loadSample(){
  const prefs=(order)=>code=>order.length-order.indexOf(code[0]);
  const fill=(name,order,giveOrder)=>{
    const rank=prefs(order), grank=prefs(giveOrder);
    const p={name, gender:"Prefer not to say", rel:"yes", qs:Q.map((_,i)=>i), ans:[], give:[], done:true};
    p.ans=p.qs.map((qi,i)=>{ const q=Q[qi]; const d=rank(q[1])-rank(q[3]); return d===0 ? i%2 : (d>0?0:1); });
    p.give=GQ.map(g=>grank(g[1])>=grank(g[3])?0:1);
    return p;
  };
  const checks=S.checks; S=fresh(); S.checks=checks; S.sample=true; S.mode="couple";
  S.people=[fill("Linh",["T","Q","W","G","A"],["A","T","Q","G","W"]), fill("Minh",["W","A","Q","T","G"],["G","A","W","Q","T"])];
}

let busy=false;
function answer(a){
  if(busy) return;
  const p=S.people[S.cur], recvN=p.qs.length, N=recvN+GQ.length, i=S.qi;
  if(i>=recvN) p.give[i-recvN]=a; else p.ans[i]=a;
  save(); render(); busy=true;
  setTimeout(()=>{ busy=false;
    if(i+1<N){ S.qi=i+1; save(); render(); return; }
    p.done=true;
    if(S.mode==="couple" && S.cur===0){ go("handoff"); return; }
    S.view=0; go("report");
  },180);
}

render();
</script>
